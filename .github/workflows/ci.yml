name: CI

on:
  # The website under site/ has its own workflow (site.yml); a change to it
  # alone does not rebuild the application.
  push:
    branches: [main, macos-compatibility]
    paths-ignore:
      - 'site/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths-ignore:
      - 'site/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:
  # Lets cd.yml run these exact jobs on a tag instead of duplicating the build
  # and dependency setup. Called jobs share the caller's run, so the artifacts
  # they upload are downloadable by the release job.
  workflow_call:

permissions:
  contents: read

# A new push to the same branch cancels an in-flight run. Tag builds are keyed
# by the tag ref, so a release is never cancelled by branch activity.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  # Last series shipping the MSI pair with a separate -devel- package.
  GSTREAMER_VERSION: '1.26.11'

jobs:
  # ── Linux ────────────────────────────────────────────────────────────────────
  linux:
    name: Linux (Ubuntu / GCC)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # A standalone Python avoids PEP 668 "externally-managed-environment",
      # which blocks the `pip install -r pymavlink/requirements.txt` that
      # third_party/mavlink/CMakeLists.txt runs during header generation.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # dpkg-dev provides dpkg-shlibdeps, which CPACK_DEBIAN_PACKAGE_SHLIBDEPS
      # uses to derive the package's Depends from the linked ELF objects.
      #
      # libglfw3-dev is kept for the case where the runner's GLFW is new enough
      # to be used directly, but CMake requires 3.4 and the runner has 3.3, so
      # in practice GLFW is built from source here. That build needs the X11
      # development packages below and libwayland-dev, which also pulls in
      # libwayland-bin for wayland-scanner. Without it GLFW's configure stops
      # at "Failed to find wayland-scanner".
      #
      # Dropping Wayland support instead is not an option: GLFW_WAYLAND_APP_ID
      # is how the window tells a Wayland desktop which .desktop entry it
      # belongs to, and so which icon to show.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config dpkg-dev \
            libglfw3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libssl-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev \
            libwayland-dev

      - name: Configure
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: cpack -G DEB --config build/CPackConfig.cmake -B build/packages

      - name: Show package contents
        run: |
          deb=$(ls build/packages/*.deb)
          echo "== $deb =="
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

      # The MCP adapter ships beside the GCS, and an agent host fails with no
      # useful message when it is missing. Check it is in the package and that
      # it runs: with no GCS listening it must still answer, with JSON-RPC's
      # "not reachable" error, which is what a host shows the user.
      - name: Check MCP adapter is packaged and runs
        run: |
          deb=$(ls build/packages/*.deb)
          root=$(mktemp -d)
          dpkg-deb -x "$deb" "$root"
          test -x "$root/usr/bin/freebodyproblem-mcp" || {
            echo "::error::freebodyproblem-mcp is missing from $deb"; exit 1; }
          out=$(echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' |
                FBP_MCP_PORT=1 FBP_MCP_TOKEN=x timeout 20 "$root/usr/bin/freebodyproblem-mcp")
          echo "$out"
          echo "$out" | grep -q '"code":-32000' || {
            echo "::error::freebodyproblem-mcp did not answer as expected"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: freebodyproblem-linux-deb
          path: build/packages/*.deb
          if-no-files-found: error

  # ── Windows ──────────────────────────────────────────────────────────────────
  #
  # A failure here fails the run, as Linux's does. It used to be marked
  # continue-on-error while the port was incomplete, which let an MSVC-only
  # compile error show a green CI and surface only when a release tag's build
  # came up without its installer.
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install -y --no-progress ninja

      # Pinned to the 1.26 series deliberately: 1.28+ replaced the MSI pair with
      # a single ~500 MB .exe and dropped the separate -devel- package, and the
      # Chocolatey gstreamer packages are stalled at 1.22.
      - name: Cache GStreamer installers
        id: gst-cache
        uses: actions/cache@v4
        with:
          path: gst-msi
          key: gstreamer-msvc-x86_64-${{ env.GSTREAMER_VERSION }}

      - name: Download GStreamer
        if: steps.gst-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GSTREAMER_VERSION/msvc"
          New-Item -ItemType Directory -Force -Path gst-msi | Out-Null
          foreach ($n in @("gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_VERSION.msi",
                           "gstreamer-1.0-devel-msvc-x86_64-$env:GSTREAMER_VERSION.msi")) {
            Write-Host "Downloading $n"
            # freedesktop.org's mirror drops long transfers part-way (curl error
            # 18) and answers 503 under load. --retry alone retries neither a
            # cut-off transfer nor every 5xx; --retry-all-errors does, and -C -
            # resumes from what is already on disk rather than starting over.
            curl.exe -fSL --retry 8 --retry-delay 10 --retry-all-errors -C - `
                     -o "gst-msi\$n" "$base/$n"
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $base/$n" }
          }

      # ADDLOCAL=ALL is required. The MSI's default silent feature set omits the
      # headers and .lib files, which is what makes a plain /quiet install look
      # like it succeeded while leaving nothing to compile against.
      - name: Install GStreamer
        shell: pwsh
        run: |
          foreach ($msi in Get-ChildItem gst-msi\*.msi) {
            Write-Host "Installing $($msi.Name)"
            $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList `
              "/i", "`"$($msi.FullName)`"", "/quiet", "/qn", "/norestart", "ADDLOCAL=ALL"
            if ($p.ExitCode -ne 0) { throw "msiexec failed ($($p.ExitCode)) for $($msi.Name)" }
          }

      - name: Locate GStreamer and OpenSSL
        shell: pwsh
        run: |
          # The installer sets this machine-wide, but not in the current process.
          $gst = [Environment]::GetEnvironmentVariable(
                   'GSTREAMER_1_0_ROOT_MSVC_X86_64', 'Machine')
          if (-not $gst) { $gst = "C:\gstreamer\1.0\msvc_x86_64" }
          $gst = $gst.TrimEnd('\')

          if (-not (Test-Path "$gst\include\gstreamer-1.0\gst\gst.h")) {
            Write-Host "::error::GStreamer headers missing under $gst"
            Write-Host "--- contents of C:\gstreamer (2 levels) ---"
            if (Test-Path C:\gstreamer) {
              Get-ChildItem C:\gstreamer -Depth 2 | Select-Object FullName |
                Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            } else { Write-Host "C:\gstreamer does not exist" }
            throw "GStreamer devel install incomplete"
          }

          "GSTREAMER_ROOT=$gst" | Out-File -Append $env:GITHUB_ENV
          "$gst\bin"           | Out-File -Append $env:GITHUB_PATH

          $ssl = @(
            "C:\Program Files\OpenSSL",
            "C:\Program Files\OpenSSL-Win64"
          ) | Where-Object { Test-Path "$_\include\openssl\ssl.h" } | Select-Object -First 1
          if (-not $ssl) { throw "No OpenSSL development headers found" }
          "OPENSSL_ROOT_DIR=$ssl" | Out-File -Append $env:GITHUB_ENV

      # Values are interpolated by Actions before pwsh sees them. A bare
      # -DFOO=$env:BAR token is NOT expanded by PowerShell in argument mode, so
      # it reaches CMake literally; quoting is also required because the
      # GStreamer and OpenSSL roots contain spaces.
      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -S . -G Ninja `
            -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" `
            -DGSTREAMER_ROOT="${{ env.GSTREAMER_ROOT }}" `
            -DOPENSSL_ROOT_DIR="${{ env.OPENSSL_ROOT_DIR }}"

      - name: Build
        run: cmake --build build --parallel

      # The runner image does not ship NSIS, so this install is the normal path
      # rather than a fallback.
      - name: Ensure NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install -y --no-progress nsis
            $nsis = "C:\Program Files (x86)\NSIS"
            if (-not (Test-Path "$nsis\makensis.exe")) {
              throw "NSIS installed but makensis.exe is not under $nsis"
            }
            # GITHUB_PATH only takes effect in *later* steps, so the current
            # session's PATH has to be patched too for the check below and for
            # anything else in this step.
            $nsis | Out-File -Append $env:GITHUB_PATH
            $env:PATH = "$env:PATH;$nsis"
          }
          makensis /VERSION

      - name: Package
        run: cpack -G NSIS --config build/CPackConfig.cmake -B build/packages

      # As on Linux: the adapter must be in the installer and run. Checked in
      # CPack's staging tree, which is exactly what the installer unpacks —
      # including the runtime DLLs it needs beside it.
      - name: Check MCP adapter is packaged and runs
        shell: pwsh
        run: |
          $exe = Get-ChildItem build\packages\_CPack_Packages -Recurse -Filter freebodyproblem-mcp.exe |
                 Where-Object { $_.Directory.Name -eq 'bin' } | Select-Object -First 1
          if (-not $exe) { throw "freebodyproblem-mcp.exe is missing from the installer's staging tree" }
          $exe.FullName
          $env:FBP_MCP_PORT = '1'; $env:FBP_MCP_TOKEN = 'x'
          $out = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | & $exe.FullName
          $out
          if (-not ($out -match '"code":-32000')) { throw "freebodyproblem-mcp did not answer as expected" }

      - name: Report installer size
        shell: pwsh
        run: |
          Get-ChildItem build\packages\*.exe |
            ForEach-Object { "{0} — {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: freebodyproblem-windows-installer
          path: build/packages/*.exe
          if-no-files-found: error

  # ── macOS ────────────────────────────────────────────────────────────────────
  #
  # Apple Silicon (macos-latest is arm64). As on Windows, GStreamer is the
  # official SDK rather than a package manager's: GStreamer.framework, which is
  # relocatable and is copied whole into the .app by cmake/macos_bundle.cmake.
  # GLFW is built from source and linked statically. The disk image that comes
  # out needs nothing else installed on the Mac it runs on.
  macos:
    name: macOS (Apple Silicon / Clang)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # openssl@3 is the fallback for a framework without OpenSSL headers;
      # when used, cmake/macos_bundle.cmake copies its dylibs into the bundle.
      - name: Install build tools
        run: brew install ninja pkg-config openssl@3

      - name: Cache GStreamer packages
        id: gst-cache
        uses: actions/cache@v4
        with:
          path: gst-pkg
          key: gstreamer-macos-universal-${{ env.GSTREAMER_VERSION }}

      - name: Download GStreamer
        if: steps.gst-cache.outputs.cache-hit != 'true'
        run: |
          base="https://gstreamer.freedesktop.org/data/pkg/osx/$GSTREAMER_VERSION"
          mkdir -p gst-pkg
          for n in "gstreamer-1.0-$GSTREAMER_VERSION-universal.pkg" \
                   "gstreamer-1.0-devel-$GSTREAMER_VERSION-universal.pkg"; do
            echo "Downloading $n"
            # Same mirror, same failure modes as the Windows download.
            curl -fSL --retry 8 --retry-delay 10 --retry-all-errors -C - \
                 -o "gst-pkg/$n" "$base/$n"
          done

      - name: Install GStreamer.framework
        run: |
          for pkg in gst-pkg/*.pkg; do
            echo "Installing $pkg"
            sudo installer -pkg "$pkg" -target /
          done
          fw=/Library/Frameworks/GStreamer.framework/Versions/1.0
          test -f "$fw/lib/pkgconfig/gstreamer-1.0.pc" || {
            echo "::error::GStreamer.framework devel files missing"; exit 1; }
          if [ -f "$fw/include/openssl/ssl.h" ]; then
            echo "OpenSSL: from GStreamer.framework"
          else
            echo "OpenSSL: framework has none, using Homebrew's"
            echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            ${OPENSSL_ROOT_DIR:+-DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR"}

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: cpack -G DragNDrop --config build/CPackConfig.cmake -B build/packages

      - name: Locate bundle
        run: |
          app=$(echo build/packages/_CPack_Packages/*/DragNDrop/*/freebodyproblem.app)
          test -d "$app" || { echo "::error::no .app in CPack's staging tree"; exit 1; }
          echo "APP=$PWD/$app" >> "$GITHUB_ENV"

      # What find_asset() and gcs_mcp_adapter_path() look for, a well-formed
      # Info.plist, and the framework copy in place.
      - name: Show bundle contents
        run: |
          find "$APP" -path '*/Frameworks/GStreamer.framework' -prune -o -type f -print | sort
          du -sh "$APP" "$APP/Contents/Frameworks/"* || true
          plutil -lint "$APP/Contents/Info.plist"
          otool -L "$APP/Contents/MacOS/freebodyproblem"
          otool -l "$APP/Contents/MacOS/freebodyproblem" | grep -A2 LC_RPATH || true
          for f in Contents/MacOS/freebodyproblem Contents/MacOS/freebodyproblem-mcp \
                   Contents/Resources/freebodyproblem.icns \
                   Contents/Resources/fonts/GeistMono-Regular.ttf \
                   Contents/Resources/icons/freebodyproblem-512.png \
                   Contents/Frameworks/GStreamer.framework/Versions/1.0/lib/gstreamer-1.0; do
            test -e "$APP/$f" || { echo "::error::$f is missing from the bundle"; exit 1; }
          done

      # Every Mach-O file in the bundle, the framework's included, must link
      # only to the system or to the bundle itself. A path into Homebrew or
      # /Library/Frameworks works on this runner and nowhere else.
      - name: Check bundle is self-contained
        run: |
          bad=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q 'Mach-O' || continue
            refs=$(otool -L "$f" | tail -n +2 | awk '{print $1}' |
                   grep -E '^/(opt/|usr/local/|Library/Frameworks/|Users/)' || true)
            if [ -n "$refs" ]; then
              echo "::error::$f links outside the bundle:"; echo "$refs"; bad=1
            fi
          done < <(find "$APP" -type f -print0)
          [ "$bad" -eq 0 ] && echo "No references outside the bundle."
          exit $bad

      - name: Verify signature
        run: codesign --verify --deep --strict --verbose=2 "$APP"

      # The real test: with the framework and Homebrew's OpenSSL moved out of
      # the way, start the app and check that it loads (no dyld "Library not
      # loaded"), and that GStreamer found its bundled plugins — gst_init()
      # runs before any window opens and writes the registry, which then has
      # to list decodebin, appsink and videoconvert — the pipeline's elements.
      - name: Run without system GStreamer
        run: |
          sudo mv /Library/Frameworks/GStreamer.framework /tmp/GStreamer.framework.off
          ossl=$(brew --prefix openssl@3)
          sudo mv "$ossl" "$ossl.off"
          trap 'sudo mv /tmp/GStreamer.framework.off /Library/Frameworks/GStreamer.framework;
                sudo mv "$ossl.off" "$ossl"' EXIT

          reg="$HOME/Library/Caches/freebodyproblem/gstreamer-registry.bin"
          rm -f "$reg"
          "$APP/Contents/MacOS/freebodyproblem" > run.log 2>&1 &
          pid=$!
          for i in $(seq 1 30); do
            [ -s "$reg" ] && break
            kill -0 $pid 2>/dev/null || break
            sleep 1
          done
          sleep 2
          kill $pid 2>/dev/null || true
          wait $pid 2>/dev/null || true
          cat run.log

          if grep -q 'Library not loaded' run.log; then
            echo "::error::the app needs a library that is not in the bundle"; exit 1
          fi
          test -s "$reg" || { echo "::error::GStreamer wrote no registry"; exit 1; }
          for p in coreelements playback appsink videoconvert; do
            grep -aq "$p" "$reg" || { echo "::error::'$p' not found in the bundled plugins"; exit 1; }
          done
          echo "Registry: $(du -h "$reg" | cut -f1), bundled plugins found."

      # As on Linux and Windows: the adapter must answer with JSON-RPC's "not
      # reachable" error when no GCS is listening. macOS has no `timeout`;
      # perl's alarm does the same job.
      - name: Check MCP adapter runs
        run: |
          out=$(echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' |
                FBP_MCP_PORT=1 FBP_MCP_TOKEN=x \
                perl -e 'alarm 20; exec @ARGV' "$APP/Contents/MacOS/freebodyproblem-mcp")
          echo "$out"
          echo "$out" | grep -q '"code":-32000' || {
            echo "::error::freebodyproblem-mcp did not answer as expected"; exit 1; }

      - name: Report disk image size
        run: ls -lh build/packages/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: freebodyproblem-macos-dmg
          path: build/packages/*.dmg
          if-no-files-found: error
