name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  # Last series shipping the MSI pair with a separate -devel- package.
  GSTREAMER_VERSION: '1.26.11'

jobs:
  # ── Linux ────────────────────────────────────────────────────────────────────
  linux:
    name: Linux (Ubuntu / GCC)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # A standalone Python avoids PEP 668 "externally-managed-environment",
      # which blocks the `pip install -r pymavlink/requirements.txt` that
      # third_party/mavlink/CMakeLists.txt runs during header generation.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # dpkg-dev provides dpkg-shlibdeps, which CPACK_DEBIAN_PACKAGE_SHLIBDEPS
      # uses to derive the package's Depends from the linked ELF objects.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config dpkg-dev \
            libglfw3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libssl-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev

      - name: Configure
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: cpack -G DEB --config build/CPackConfig.cmake -B build/packages

      - name: Show package contents
        run: |
          deb=$(ls build/packages/*.deb)
          echo "== $deb =="
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

      - uses: actions/upload-artifact@v4
        with:
          name: freebodyproblem-linux-deb
          path: build/packages/*.deb
          if-no-files-found: error

  # ── Windows ──────────────────────────────────────────────────────────────────
  #
  # Marked continue-on-error: the Windows port is incomplete — serial transport
  # is compiled out (frontend/main.cpp) and list_serial_ports() returns empty
  # (backend/connection.cpp). This job exists to surface compile breakage while
  # that work happens. Remove continue-on-error once it is reliably green.
  windows:
    name: Windows (MSVC) [porting]
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install -y --no-progress ninja

      # Pinned to the 1.26 series deliberately: 1.28+ replaced the MSI pair with
      # a single ~500 MB .exe and dropped the separate -devel- package, and the
      # Chocolatey gstreamer packages are stalled at 1.22.
      - name: Cache GStreamer installers
        id: gst-cache
        uses: actions/cache@v4
        with:
          path: gst-msi
          key: gstreamer-msvc-x86_64-${{ env.GSTREAMER_VERSION }}

      - name: Download GStreamer
        if: steps.gst-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GSTREAMER_VERSION/msvc"
          New-Item -ItemType Directory -Force -Path gst-msi | Out-Null
          foreach ($n in @("gstreamer-1.0-msvc-x86_64-$env:GSTREAMER_VERSION.msi",
                           "gstreamer-1.0-devel-msvc-x86_64-$env:GSTREAMER_VERSION.msi")) {
            Write-Host "Downloading $n"
            curl.exe -fSL --retry 3 -o "gst-msi\$n" "$base/$n"
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $base/$n" }
          }

      # ADDLOCAL=ALL is required. The MSI's default silent feature set omits the
      # headers and .lib files, which is what makes a plain /quiet install look
      # like it succeeded while leaving nothing to compile against.
      - name: Install GStreamer
        shell: pwsh
        run: |
          foreach ($msi in Get-ChildItem gst-msi\*.msi) {
            Write-Host "Installing $($msi.Name)"
            $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList `
              "/i", "`"$($msi.FullName)`"", "/quiet", "/qn", "/norestart", "ADDLOCAL=ALL"
            if ($p.ExitCode -ne 0) { throw "msiexec failed ($($p.ExitCode)) for $($msi.Name)" }
          }

      - name: Locate GStreamer and OpenSSL
        shell: pwsh
        run: |
          # The installer sets this machine-wide, but not in the current process.
          $gst = [Environment]::GetEnvironmentVariable(
                   'GSTREAMER_1_0_ROOT_MSVC_X86_64', 'Machine')
          if (-not $gst) { $gst = "C:\gstreamer\1.0\msvc_x86_64" }
          $gst = $gst.TrimEnd('\')

          if (-not (Test-Path "$gst\include\gstreamer-1.0\gst\gst.h")) {
            Write-Host "::error::GStreamer headers missing under $gst"
            Write-Host "--- contents of C:\gstreamer (2 levels) ---"
            if (Test-Path C:\gstreamer) {
              Get-ChildItem C:\gstreamer -Depth 2 | Select-Object FullName |
                Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            } else { Write-Host "C:\gstreamer does not exist" }
            throw "GStreamer devel install incomplete"
          }

          "GSTREAMER_ROOT=$gst" | Out-File -Append $env:GITHUB_ENV
          "$gst\bin"           | Out-File -Append $env:GITHUB_PATH

          $ssl = @(
            "C:\Program Files\OpenSSL",
            "C:\Program Files\OpenSSL-Win64"
          ) | Where-Object { Test-Path "$_\include\openssl\ssl.h" } | Select-Object -First 1
          if (-not $ssl) { throw "No OpenSSL development headers found" }
          "OPENSSL_ROOT_DIR=$ssl" | Out-File -Append $env:GITHUB_ENV

      # Values are interpolated by Actions before pwsh sees them. A bare
      # -DFOO=$env:BAR token is NOT expanded by PowerShell in argument mode, so
      # it reaches CMake literally; quoting is also required because the
      # GStreamer and OpenSSL roots contain spaces.
      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -S . -G Ninja `
            -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" `
            -DGSTREAMER_ROOT="${{ env.GSTREAMER_ROOT }}" `
            -DOPENSSL_ROOT_DIR="${{ env.OPENSSL_ROOT_DIR }}"

      - name: Build
        run: cmake --build build --parallel

      # The runner image ships NSIS, but install it if that ever changes rather
      # than failing at the packaging step.
      - name: Ensure NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install -y --no-progress nsis
            "C:\Program Files (x86)\NSIS" | Out-File -Append $env:GITHUB_PATH
          }
          makensis /VERSION

      - name: Package
        run: cpack -G NSIS --config build/CPackConfig.cmake -B build/packages

      - name: Report installer size
        shell: pwsh
        run: |
          Get-ChildItem build\packages\*.exe |
            ForEach-Object { "{0} — {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: freebodyproblem-windows-installer
          path: build/packages/*.exe
          if-no-files-found: error
