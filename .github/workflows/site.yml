name: Site

# Builds the website in site/ (Astro + Starlight) and publishes it to GitHub
# Pages. Kept apart from CI: an edit to the site does not rebuild the
# application, and an application change does not redeploy the site — except
# what the site shows of it:
#
#   screens/   the screenshots the pages import, shared with the README
#   a release  the download buttons resolve to the latest release's files at
#              build time; cd.yml dispatches this workflow after publishing one
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'screens/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and a newer one replaces a queued older one — but
# one already deploying is let finish rather than cut off half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      # The token lifts the anonymous GitHub API rate limit for the
      # latest-release lookup (src/lib/release.ts).
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
